name: EAS Build

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_profile:
        description: 'Build profile (preview or production)'
        required: false
        default: 'preview'
        type: choice
        options:
          - preview
          - production

jobs:
  build:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Install dependencies
        working-directory: frontend
      run: npm install --legacy-peer-deps
      - name: Build Android
        working-directory: frontend
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform android --profile ${{ github.event.inputs.build_profile || 'preview' }} --non-interactive
